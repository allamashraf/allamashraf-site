proto-architecture:
  text: "Each lead's phone number is normalized, the lead is scored from 0 to 100 into Hot, Warm or Cold, duplicates are caught by the normalized phone, the lead is assigned to a sales rep by round-robin, and Hot leads trigger an SLA alert."
  status: USER_REPORTED
  evidenceRef: "Prototype source folder, held by Allam (not published)"
  approvedBy: "Allam"
  date: "2026-10-22"
proto-built:
  text: "A JavaScript module that normalizes Egyptian phone numbers into one format and scores each lead with simple, readable rules: budget given, price or payment questions, a site-visit request, a valid phone, and urgency words, matched in Arabic and English. The score also sets a follow-up of 1, 2 or 3 days. Around it: an error log for broken payloads and ready-to-send Telegram summaries, plus n8n workflow templates and an Airtable schema for a live version."
  status: USER_REPORTED
  evidenceRef: "Scoring code read by Allam, 22 Oct 2026; source held by Allam"
  approvedBy: "Allam"
  date: "2026-10-22"
