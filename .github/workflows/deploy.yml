name: Deploy to GitHub Pages

# MANUAL ONLY. Do not add push triggers until Allam approves automatic deploys in writing.
# Does nothing until Settings > Pages > Source is set to "GitHub Actions" (see docs/DEPLOY.md).
on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install, build (with claims gate) and upload
        uses: withastro/action@a8b97df764791eb61fbf3338ef713b0e61ae05c5 # v6
        with:
          node-version: 24
          build-cmd: npm run build:prod
        env:
          # External delivery confirmed by Allam with inbox evidence on 31 Oct 2026.
          EMAIL_PUBLISHED: 'true'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
