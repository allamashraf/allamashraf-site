name: Deploy to GitHub Pages

# MANUAL ONLY. Do not add push triggers until Allam approves automatic deploys in writing.
# Does nothing until Settings > Pages > Source is set to "GitHub Actions" (see docs/DEPLOY.md).
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install, build (with claims gate) and upload
        uses: withastro/action@3eafd002e65cc31b4f0eae0bb05450d521562247 # v6
        with:
          node-version: 24
          build-cmd: npm run build:prod
        env:
          # Flip to 'true' only after the allam@ forwarding test passes (docs/DNS_PLAN.md).
          EMAIL_PUBLISHED: 'false'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
