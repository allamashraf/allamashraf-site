name: CI

# Runs on pull requests only. Keep it short: the private-repo phase spends GitHub Free minutes.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # gitleaks scans full history

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npx astro check
      - run: npm run test:unit

      # build:prod includes the claims gate (blocked-figures.txt is local-only and absent in CI).
      - run: npm run build:prod
      - run: npm run check:budgets

      - run: npx playwright install --with-deps chromium firefox webkit
      # Playwright covers routes, internal links, axe, overflow, no-JS, reduced motion, CSP.
      - run: npx playwright test

      - run: npx lhci autorun
        env:
          LHCI_BUILD_CONTEXT__CURRENT_BRANCH: ${{ github.head_ref }}

      - run: npm run check:lcp-scripts

      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_ENABLE_COMMENTS: 'false'

      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-quality-reports
          path: |
            playwright-report/
            .lighthouseci/
          include-hidden-files: true
          retention-days: 7
